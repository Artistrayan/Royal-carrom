name: Deploy Royal Carrom Web Test

on:
  push:
    branches: [main]
    paths:
      - "web-test/**"
      - ".github/workflows/deploy-web-test.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload web test site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-test
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
